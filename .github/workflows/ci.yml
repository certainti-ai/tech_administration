name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repo tooling (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test secrets tooling
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (workspace root)
        run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    name: Terraform (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `terraform validate` needs `init`, `init` needs the provider registry,
      # and the registry is unreachable from the sessions that write this code
      # (docs/HANDOFF.md §10). These are the checks that catch what actually
      # goes wrong: an undeclared variable, a local left behind by a refactor,
      # and a cloud-init input that templatefile() forgets to supply — which
      # otherwise fails at apply time, after resources exist.
      - run: python tools/check_terraform.py infra/terraform
      # infra/entra is a second root module — the app registration, applied by a
      # person with directory rights rather than by the deployment. Checked here
      # so it cannot rot while nothing exercises it.
      - run: python tools/check_terraform.py infra/entra
      - name: Formatting
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip -o tf.zip
          unzip -q tf.zip && ./terraform fmt -check -recursive infra/terraform infra/entra
      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck infra/deploy/*.sh

  # Placeholder until packages/ is populated in Phase 1 — see docs/HANDOFF.md.
  # Kept in place so the job name is stable once Python lands.
  python:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check whether Python packages exist yet
        id: probe
        run: |
          if compgen -G "packages/*/pyproject.toml" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No packages/*/pyproject.toml yet — skipping. See docs/HANDOFF.md."
          fi
      - name: Install and verify
        if: steps.probe.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          for pkg in packages/*/; do
            [ -f "$pkg/pyproject.toml" ] && pip install -e "$pkg[dev]"
          done
          ruff check packages/
          # Per package, not `pytest packages/`: each package carries its own
          # pytest config (asyncio_mode, testpaths), and a repo-root rootdir
          # silently ignores all of it.
          for pkg in packages/*/; do
            [ -f "$pkg/pyproject.toml" ] || continue
            echo "::group::pytest $pkg"
            (cd "$pkg" && pytest -q)
            echo "::endgroup::"
          done

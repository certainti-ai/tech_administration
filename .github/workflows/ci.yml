name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Repo tooling (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test secrets tooling
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (workspace root)
        run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Placeholder until packages/ is populated in Phase 1 — see docs/HANDOFF.md.
  # Kept in place so the job name is stable once Python lands.
  python:
    name: Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check whether Python packages exist yet
        id: probe
        run: |
          if compgen -G "packages/*/pyproject.toml" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No packages/*/pyproject.toml yet — skipping. See docs/HANDOFF.md."
          fi
      - name: Install and verify
        if: steps.probe.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          for pkg in packages/*/; do
            [ -f "$pkg/pyproject.toml" ] && pip install -e "$pkg"
          done
          ruff check packages/
          pytest packages/ -q

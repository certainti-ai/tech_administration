name: Deploy to maintenance VM

# Deployment is repeatable from CI rather than by hand (PRD FR-5.4).
#
# The VM has no public IP, so this does not SSH in: it authenticates to Azure
# over OIDC and runs the deploy script through `az vm run-command`, which works
# against a host with no inbound access at all.
#
# Manual trigger only. Nothing deploys to the maintenance host because a commit
# landed — that host can purge production.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: true
        default: "main"
      verify_only:
        description: "Run the read-only checks without deploying"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-maintenance-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: maintenance-vm # gate approvals here
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `ref` is a dispatch input, and it used to be interpolated straight into
      # the shell below — twice: once into the runner's shell by `${{ }}`, and
      # once into a command string that `az vm run-command` executes on the VM.
      # A ref of `main'; curl … | sh; '` therefore ran on both. Neither is a
      # place to discover that a branch name is arbitrary text, so the name is
      # checked against what a git ref may contain before it is used, and is
      # passed through the environment rather than pasted into the script.
      - name: Check the ref is a ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            *[!A-Za-z0-9./_-]* | "" | -* | */ | *..*)
              echo "::error::'$REF' is not a plain branch or tag name."
              exit 1 ;;
          esac
          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Deploy
        if: ${{ !inputs.verify_only }}
        env:
          RESOURCE_GROUP: ${{ vars.MAINTENANCE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.MAINTENANCE_VM_NAME }}
        run: |
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "sudo -u trd365 TRD365_BRANCH='$REF' /opt/trd365/deploy.sh" \
            --query "value[0].message" -o tsv

      - name: Verify
        env:
          RESOURCE_GROUP: ${{ vars.MAINTENANCE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.MAINTENANCE_VM_NAME }}
        run: |
          az vm run-command invoke \
            --resource-group "$RESOURCE_GROUP" \
            --name "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "sudo /opt/trd365/verify.sh" \
            --query "value[0].message" -o tsv

name: Secrets check

# Verifies that Key Vault holds every secret the manifest declares.
#
# No secret values are stored in GitHub and none are printed: the job
# authenticates over OIDC and reports presence and digests only. See
# docs/secrets.md for the federated-credential setup this depends on.

on:
  schedule:
    - cron: "17 6 * * 1" # Monday mornings, before the working week needs them
  workflow_dispatch:
  push:
    paths:
      - "scripts/secrets/**"
      - ".github/workflows/secrets-check.yml"

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Job-level ids are not secrets — they identify the app, they do not
    # authenticate it. The OIDC trust relationship is what grants access, so
    # these live in repository *variables*, not secrets.
    env:
      AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the vault matches the manifest
        run: node scripts/secrets/check.mjs --require-complete

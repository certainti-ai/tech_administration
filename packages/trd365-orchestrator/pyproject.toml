[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trd365-orchestrator"
version = "0.1.0"
description = "Job execution, approvals, audit and health API for the trd365 maintenance utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "trd365-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # ID-token verification for Entra sign-in. PyJWT rather than hand-rolled
    # signature checking, and [crypto] because RS256 needs it — without the extra,
    # PyJWT silently supports only HMAC and every Entra token fails to verify.
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

# The console ships with the package; without this the wheel installs the module
# and not its HTML, and `/` falls back to JSON on a deployed host while working
# fine from a source checkout.
[tool.setuptools.package-data]
trd365_orchestrator = ["web/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends() and Query() in argument defaults are FastAPI's dependency-injection
# idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

<!--
  The operator console.

  One dependency-free file on purpose. There is no Node on the maintenance VM and
  no build step in the deploy, so a bundler would mean either committing build
  output or installing a toolchain on a host that holds production credentials.
  Phase 3's React SPA replaces this; until then it is the whole client.

  Two rules it keeps, which any rewrite should keep too:

  * Status is never colour alone. Every pill carries a glyph and a word, and
    anything failing is named in text, not just tinted.
  * State the service computes is read, not recomputed here. The environment pill
    follows `status` off the health payload; whether a run needs an approver comes
    from the preview endpoint. A console that recalculates ends up disagreeing
    with the API it reads.
-->

<style>
:root {
  /* Poppins throughout, and 600 is the heaviest weight anywhere: 700 is
     deliberately not even loaded, so a stray `font-weight: bold` renders as the
     synthesised faux-bold browsers apply to a missing face and is obvious rather
     than silently correct-looking. */
  --display: "Poppins", system-ui, sans-serif;
  --body: "Poppins", system-ui, sans-serif;
  /* Monospace stays for rids, schema names, SQL and timestamps — those need
     character alignment, which no proportional face gives. */
  --mono: "JetBrains Mono", ui-monospace, monospace;

  --bg: #f6f8f9;
  --surface: #ffffff;
  --sunk: #eef2f4;
  --line: #dde5e9;
  --ink: #10222b;
  --ink-2: #40525c;
  --muted: #6b7d87;

  --accent: #0f6e6b;
  --accent-soft: #e2f1f0;
  --ok: #1c6b45;
  --ok-bg: #e3f2e9;
  --warn: #8a5109;
  --warn-bg: #fdeedb;
  --danger: #a4232b;
  --danger-bg: #fbe6e7;
  --idle: #84949d;
  --idle-bg: #eaeff2;

  --radius: 10px;
  --shadow: 0 1px 2px rgb(16 34 43 / 6%), 0 4px 12px rgb(16 34 43 / 4%);
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg: #0b1215;
    --surface: #111a1f;
    --sunk: #162228;
    --line: #22333b;
    --ink: #e8f0f2;
    --ink-2: #b3c4cb;
    --muted: #8497a0;
    --accent: #4ecdc4;
    --accent-soft: #10312f;
    --ok: #62c78f;
    --ok-bg: #102c1e;
    --warn: #e0a45c;
    --warn-bg: #33240f;
    --danger: #f0868c;
    --danger-bg: #331417;
    --idle: #7c8e97;
    --idle-bg: #18242a;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 18px rgb(0 0 0 / 25%);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1215;
  --surface: #111a1f;
  --sunk: #162228;
  --line: #22333b;
  --ink: #e8f0f2;
  --ink-2: #b3c4cb;
  --muted: #8497a0;
  --accent: #4ecdc4;
  --accent-soft: #10312f;
  --ok: #62c78f;
  --ok-bg: #102c1e;
  --warn: #e0a45c;
  --warn-bg: #33240f;
  --danger: #f0868c;
  --danger-bg: #331417;
  --idle: #7c8e97;
  --idle-bg: #18242a;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 18px rgb(0 0 0 / 25%);
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: .92em; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; line-height: 1.25; }

/* One rule so nothing can render heavier than semi-bold. Headings and <strong>
   default to 700 in every browser, and 700 is not loaded — the result would be a
   synthesised faux-bold, which looks like a design choice and is not one. */
h1, h2, h3, h4, h5, h6, strong, b, th, .pill { font-weight: 600; }
button { font: inherit; }

/* ---------------------------------------------------------------- app shell */

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; } }

.side {

}

.side-foot strong { color: var(--ink); font-weight: 600; }

/* ------------------------------------------------------------------- content */

main { min-width: 0; padding: 0 0 64px; }
.topbar {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);

@media (max-width: 700px) { .topbar, .view { padding-left: 18px; padding-right: 18px; } }

/* --------------------------------------------------------------- primitives */

        border-radius: var(--radius); box-shadow: var(--shadow); }

.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.danger { background: var(--danger-bg); color: var(--danger); }
.pill .g { font-size: 10px; line-height: 1; }

.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        padding: 15px 17px; }
.stat .v { font: 600 27px/1.1 var(--display); letter-spacing: -.02em; }
.stat .k { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.stat .sub { font-size: 11.5px; color: var(--muted); margin-top: 7px; }

.grid { display: grid; gap: 13px; align-items: start; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

.stripe { border-left: 3px solid var(--line); }
.s-ok { border-left-color: var(--ok); }
.s-warn { border-left-color: var(--warn); }
.s-danger { border-left-color: var(--danger); }
.s-idle { border-left-color: var(--idle); }

.banner { border-radius: var(--radius); padding: 12px 15px; font-size: 13.5px;
          border: 1px solid transparent; margin-bottom: 14px; }
.banner.warn { background: var(--warn-bg); color: var(--warn);
               border-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.banner.danger { background: var(--danger-bg); color: var(--danger);
                 border-color: color-mix(in srgb, var(--danger) 25%, transparent); }
.banner.info { background: var(--accent-soft); color: var(--accent);

input[type=text], input[type=number], select {

}

.actions { display: flex; gap: 8px; margin-top: 16px; }
.btn { padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line);

.db.bad i { background: var(--danger); }
.dbs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.readout { font-size: 12.5px; color: var(--muted); margin: 7px 0 0; }

<div class="app">
  <nav class="side">
    <div class="brand">
      <div class="mark">Certainti</div>
      <h1>Tech Administration</h1>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot" id="who"><span class="spin"></span>identifying…</div>
  </nav>

  <main>
    <div class="topbar">
      <div>
        <h2 id="view-title">Overview</h2>
        <p id="view-sub"></p>
      </div>
      <div class="spacer"></div>
      <div id="view-aside"></div>
    </div>
    <div class="view" id="view"><p class="muted"><span class="spin"></span>loading…</p></div>
  </main>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------- helpers */

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (v ?? 0).toLocaleString();

const GLYPH = { ok: "●", warn: "▲", danger: "■", idle: "○" };
const pill = (tone, label) =>
  `<span class="pill ${tone}"><span class="g" aria-hidden="true">${GLYPH[tone]}</span>${esc(label)}</span>`;

async function api(path, options) {
  const response = await fetch(path, {
    headers: { "content-type": "application/json" },
    ...options,
  });
  if (!response.ok) {
    let detail = `${response.status} ${response.statusText}`;
    try {
      const body = await response.json();
      if (body.detail) detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
    } catch { /* keep the status line */ }
    throw new Error(detail);
  }
  return response.status === 204 ? null : response.json();
}

const fail = (message) =>
  `<div class="banner danger"><strong>Could not load.</strong> ${esc(message)}</div>`;
const loading = `<p class="muted"><span class="spin"></span>loading…</p>`;
const when = (v) => esc(String(v ?? "").slice(0, 19).replace("T", " "));

/* --------------------------------------------------------------------- state */

const state = {
  me: null,
  environments: null,
  utilities: null,
  jobs: null,
  audit: null,
  models: {},          // environment -> snapshot or null
  selected: null,      // the utility id open in the run panel
  form: {},            // its field values
  apply: false,
  preview: null,
};

/* ----------------------------------------------------------------- the views */

const VIEWS = [
  { id: "overview", icon: "◎", title: "Overview", sub: "Everything worth knowing at a glance." },
  { id: "environments", icon: "⬒", title: "Environments", sub: "Credential readiness and reachability, per database." },
  { id: "utilities", icon: "▤", title: "Utilities", sub: "The catalogue the service loads at start-up. Pick one to run it." },
  { id: "model", icon: "◈", title: "Data model", sub: "The snapshot every destructive utility reads before it will write." },
  { id: "activity", icon: "≡", title: "Activity", sub: "Runs submitted here, and every invocation recorded on this host." },
];

function currentView() {
  const id = (location.hash || "#/overview").replace("#/", "");
  return VIEWS.find((v) => v.id === id) || VIEWS[0];
}

function renderNav() {
  const active = currentView().id;
  const counts = {
    environments: state.environments?.length,
    utilities: state.utilities?.length,
    activity: (state.jobs?.length ?? 0) + (state.audit?.length ?? 0) || undefined,
  };
  $("nav").innerHTML = VIEWS.map((v) => `
    <a href="#/${v.id}" ${v.id === active ? 'aria-current="page"' : ""}>
      <span class="ico" aria-hidden="true">${v.icon}</span>${esc(v.title)}
      ${counts[v.id] != null ? `<span class="count">${counts[v.id]}</span>` : ""}
    </a>`).join("");
}

/* ---------------------------------------------------------------- who am I */

async function loadMe() {
  const info = await api("/api").catch(() => ({}));
  const sso = info.authentication === "entra id";
  const signIn = `<a href="/auth/login?next=${encodeURIComponent(
    location.hash || "#/overview",
  )}">Sign in with Microsoft</a>`;

  try {
    state.me = await api("/api/me");
  } catch (error) {
    // /api/me is public, so reaching here means the service is unreachable
    // rather than that nobody is signed in.
    $("who").innerHTML = `<span class="muted">${esc(error.message)}</span>`;
    return;
  }

  // Three states, not two, and they were collapsed into two before: this
  // endpoint answers 200 with an anonymous identity rather than refusing, so
  // "not signed in" arrived here as a success and the offer to sign in — which
  // lived in the catch above — was never shown. The console read "unauthenticated
  // / none / sign out" with no way in.
  if (!state.me.authenticated) {
    $("who").innerHTML = sso
      ? signIn
      : `<span class="muted">not signed in</span>`;
    return;
  }

  const roles = state.me.roles.length ? state.me.roles.join(", ") : "no role assigned";
  $("who").innerHTML =
    `<strong>${esc(state.me.display_name)}</strong><br>` +
    `<span class="roles">${esc(roles)}</span>` +
    (sso ? `<br><a href="/auth/logout">sign out</a>` : "");
}

/* Says why every panel is empty, which is otherwise indistinguishable from a
   broken application. Two different causes, two different remedies. */
function accessNotice() {
  const me = state.me;
  if (!me || me.can_view) return "";
  if (!me.authenticated) {
    return `<div class="banner info"><strong>Not signed in.</strong> Environments,
      utilities, the data model and the audit trail all need a sign-in, so every
      panel below is empty rather than broken.
      <a href="/auth/login?next=${encodeURIComponent(location.hash || "#/overview")}">Sign
      in with Microsoft</a>.</div>`;
  }
  return `<div class="banner warn"><strong>No role assigned.</strong> Signing in
    worked — you are ${esc(me.display_name)} — but nothing has been granted to it
    yet, so there is nothing to show. Ask an administrator for
    <code>viewer</code> to read, or <code>operator</code> to start runs.</div>`;
}

/* ------------------------------------------------------------- environments */

const STATUS = {
  good: ["ok", "Connected"],
  warning: ["warn", "Model attention"],
  critical: ["danger", "Unreachable"],
  unconfigured: ["idle", "Credentials pending"],
};

function envCard(env) {
  const total = env.databases.length;
  const ready = env.databases.filter((d) => d.configured).length;
  const reachable = env.databases.filter((d) => d.reachable === true).length;
  const probed = env.databases.filter((d) => d.reachable != null).length;
  const failed = env.databases.filter((d) => d.configured && d.reachable === false);
  const latencies = env.databases.map((d) => d.latency_ms).filter((v) => v != null);

  const derived =
    ready === 0 ? "unconfigured" : failed.length ? "critical" : ready < total ? "warning" : "good";
  let [tone, label] = STATUS[env.status ?? derived] ?? ["idle", env.status ?? derived];

  let pillNamesTheModel = false;
  if (label === "Model attention") {
    if (ready < total) label = `${ready} of ${total} configured`;
    else if (env.model && !env.model.present) { label = "No snapshot yet"; pillNamesTheModel = true; }
    else if (env.model && env.model.stale) { label = "Snapshot stale"; pillNamesTheModel = true; }
  }

  const detail = [];
  if (ready === 0) detail.push(`no credentials for ${total} ${total === 1 ? "database" : "databases"}`);
  else if (!probed) detail.push(`${ready} of ${total} configured, not probed`);
  else {
    detail.push(`${reachable} of ${total} reachable`);
    if (latencies.length) detail.push(`slowest ${Math.max(...latencies)}ms`);
    if (failed.length) detail.push(`failing: ${failed.map((d) => d.db_key).join(", ")}`);
  }
  if (env.model?.present && env.model.fingerprint) {
    detail.push(`model ${env.model.fingerprint.slice(0, 8)}${env.model.stale ? " (stale)" : ""}`);
  } else if (ready > 0 && !pillNamesTheModel) detail.push("no model snapshot");

  const dbs = env.databases.map((d) =>
    `<span class="db ${d.configured ? "on" : ""}${d.reachable === false && d.configured ? " bad" : ""}"
           title="${esc(d.error ?? "configured")}">
       <i aria-hidden="true"></i>${esc(d.db_key)}${d.latency_ms != null ? ` ${d.latency_ms}ms` : ""}
     </span>`).join("");

  return `<article class="card pad stripe s-${tone}">
    <div class="util-top" style="display:flex;align-items:center;gap:10px">
      <h3 style="text-transform:uppercase;letter-spacing:.07em;font-size:12.5px">${esc(env.environment)}</h3>
      ${pill(tone, label)}
    </div>
    <p class="readout">${esc(detail.join(" · "))}</p>
    <div class="dbs">${dbs}</div>
    ${env.environment === "prod"
      ? `<p class="foot">Production. Anything that writes needs a second approver.</p>` : ""}
  </article>`;
}

/* ----------------------------------------------------------------- overview */

function attention() {
  const items = [];
  for (const env of state.environments ?? []) {
    if (env.status === "critical") {
      const failing = env.databases.filter((d) => d.configured && d.reachable === false);
      items.push(["danger", `${env.environment}: ${failing.map((d) => d.db_key).join(", ")} not reachable`]);
    } else if (env.status === "warning" && !env.model?.present) {
      items.push(["warn", `${env.environment}: configured but has no data-model snapshot, so destructive utilities will refuse to run`]);
    }
  }
  for (const job of state.jobs ?? []) {
    if (job.state === "pending_approval") {
      items.push(["warn", `${job.utility_id} on ${job.environment} is waiting for an approver (requested by ${job.requested_by})`]);
    } else if (job.state === "failed") {
      items.push(["danger", `${job.utility_id} on ${job.environment} failed: ${job.error ?? "no reason recorded"}`]);
    }
  }
  return items;
}

function renderOverview() {
  const envs = state.environments ?? [];
  const configured = envs.filter((e) => e.status !== "unconfigured");
  const snapshots = Object.values(state.models).filter(Boolean);
  const newest = snapshots.sort((a, b) => (b.generated_at ?? "").localeCompare(a.generated_at ?? ""))[0];
  const runs = (state.audit ?? []).length;
  const applied = (state.audit ?? []).filter((r) => r.mode === "apply").length;
  const notes = attention();

  return `
    ${notes.length ? `<div class="section">${notes.map(([tone, text]) =>
        `<div class="banner ${tone === "danger" ? "danger" : "warn"}">${esc(text)}</div>`).join("")}</div>`
      : `<div class="banner info"><strong>Nothing needs attention.</strong> No unreachable
         database, no run waiting for approval, no failure recorded.</div>`}

    <div class="section">
      <div class="stats">
        <div class="stat"><div class="v">${configured.length}<span class="muted" style="font-size:16px"> / ${envs.length}</span></div>
          <div class="k">Environments configured</div>
          <div class="sub">${esc(configured.map((e) => e.environment).join(", ") || "none")}</div></div>
        <div class="stat"><div class="v">${num(state.utilities?.length)}</div>
          <div class="k">Utilities available</div>
          <div class="sub">${num((state.utilities ?? []).filter((u) => u.impact === "destructive").length)} destructive</div></div>
        <div class="stat"><div class="v">${newest ? num(newest.summary?.tables) : "—"}</div>
          <div class="k">Tables in the newest snapshot</div>
          <div class="sub">${newest ? `${esc(newest.environment)} · ${when(newest.generated_at)}` : "no snapshot captured"}</div></div>
        <div class="stat"><div class="v">${num(runs)}</div>
          <div class="k">Runs recorded here</div>
          <div class="sub">${num(applied)} applied, ${num(runs - applied)} dry run</div></div>
      </div>
    </div>

    <div class="section">
      <header><h3>Environments</h3><p>Follow the service's own classification.</p></header>
      <div class="grid g3">${envs.map(envCard).join("") || `<p class="muted">none</p>`}</div>
    </div>

    <div class="section">
      <header><h3>Recent activity</h3>
        <p><a href="#/activity">see all</a></p></header>
      ${auditTable((state.audit ?? []).slice(0, 6))}
    </div>`;
}

/* ---------------------------------------------------------------- utilities */

const IMPACT = {
  destructive: ["danger", "Destructive"],
  writes: ["warn", "Writes"],
  "read-only": ["ok", "Read only"],
};

function utilityRow(u) {
  const [tone, label] = IMPACT[u.impact] ?? ["idle", u.impact];
  const selected = state.selected === u.id;
  return `<button class="util stripe s-${tone}" aria-pressed="${selected}" data-util="${esc(u.id)}">
    <div class="top">
      <h4>${esc(u.title)}</h4>${pill(tone, label)}
      ${u.dry_run_executes ? pill("warn", "preview runs") : ""}
    </div>
    <div class="id">${esc(u.id)}</div>
    <p>${esc(u.description)}</p>
    <div class="meta">${u.databases.map((d) => `<span class="chip">${esc(d)}</span>`).join("")}</div>
  </button>`;
}

function fieldFor(p) {
  const key = p.name;
  const value = state.form[key] ?? (p.default != null ? String(p.default) : "");
  const type = p.type === "integer" ? "number" : "text";
  if (p.type === "boolean") {
    return `<div class="field">
      <label for="f-${esc(key)}">${esc(key)}</label>
      <select id="f-${esc(key)}" data-field="${esc(key)}">
        <option value="">not set</option>
        <option value="true" ${value === "true" ? "selected" : ""}>true</option>
        <option value="false" ${value === "false" ? "selected" : ""}>false</option>
      </select>
      <div class="help">${esc(p.help)}</div></div>`;
  }
  return `<div class="field">
    <label for="f-${esc(key)}">${esc(key)}${p.required ? '<span class="req" title="required">*</span>' : ""}</label>
    <input id="f-${esc(key)}" type="${type}" data-field="${esc(key)}" value="${esc(value)}"
           placeholder="${esc(p.default ?? "")}">
    <div class="help">${esc(p.help)}</div></div>`;
}

function runPanel() {
  if (!state.selected) {
    return `<div class="card empty">Pick a utility to see what it does and run it.</div>`;
  }
  const u = state.utilities.find((x) => x.id === state.selected);
  if (!u) return `<div class="card empty">That utility is no longer in the catalogue.</div>`;

  const [tone, label] = IMPACT[u.impact] ?? ["idle", u.impact];
  const env = state.form.__env ?? "dev";
  const canRun = state.me?.can_run || u.impact === "read-only";
  const warnings = [];

  if (u.impact === "destructive") {
    warnings.push(["danger",
      `<strong>Destructive.</strong> This deletes rows. Every row is copied into a
       backup schema first, and the run is audited.`]);
  }
  if (u.dry_run_executes) {
    warnings.push(["warn",
      `<strong>A preview here is not free.</strong> This utility previews by running the
       vendor's delete-and-recompute SQL inside a transaction it then rolls back — the
       same locks, the same work, the result discarded. In production a preview needs an
       approver for that reason.`]);
  }
  if (state.me && state.me.roles.length === 0) {
    warnings.push(["warn",
      `<strong>No role assigned.</strong> You are signed in, but nobody has assigned
       you a role for this application yet. Ask an administrator to assign one in
       Entra ID; being known is not the same as being permitted.`]);
  }
  if (!canRun) {
    warnings.push(["info",
      `<strong>Read-only sign-in.</strong> Starting this needs the <code>operator</code>
       role; this session has ${esc(state.me?.roles.join(", ") || "no roles")}.`]);
  }
  if (state.preview?.requires_approval) {
    warnings.push(["warn",
      `<strong>This will wait for a second person.</strong> It is submitted as
       <code>pending_approval</code> and does not start until somebody else with the
       approver role approves it. Self-approval is refused.`]);
  }

  return `<div class="card pad panel">
    <h3>${esc(u.title)}</h3>
    <div class="sub">${esc(u.id)}</div>
    <div style="margin:10px 0 4px">${pill(tone, label)}
      ${u.requires_approval_in_prod ? pill("warn", "approver in prod") : ""}</div>
    <p style="font-size:13px;color:var(--ink-2)">${esc(u.description)}</p>
    ${u.notes ? `<p class="muted" style="font-size:12px">${esc(u.notes)}</p>` : ""}

    ${warnings.map(([t, html]) => `<div class="banner ${t}">${html}</div>`).join("")}

    <div class="field">
      <label for="f-env">environment</label>
      <select id="f-env" data-field="__env">
        ${["dev", "qa", "stage", "prod"].map((e) =>
          `<option value="${e}" ${e === env ? "selected" : ""}>${e}</option>`).join("")}
      </select>
    </div>

    <div class="field">
      <label>mode</label>
      <div class="toggle">
        <button type="button" data-mode="dry" aria-pressed="${!state.apply}">Dry run</button>
        <button type="button" data-mode="apply" aria-pressed="${state.apply}">Apply</button>
      </div>
      <div class="help">${state.apply
        ? "Writes. Production additionally needs an approver."
        : (u.dry_run_executes
            ? "Reports what would change — by doing it and rolling back. Not free."
            : "Reports what would change without touching anything.")}</div>
    </div>

    ${u.parameters.filter((p) => !["out_dir"].includes(p.name)).map(fieldFor).join("")}

    <div class="actions">
      <button class="btn" id="btn-preview">Show the command</button>
      <button class="btn primary" id="btn-run" ${canRun ? "" : "disabled"}>
        ${state.apply ? "Apply" : "Dry run"}
      </button>
    </div>
    <div id="run-result"></div>
    ${state.preview ? `<pre class="cmd">${esc(state.preview.command.join(" "))}</pre>` : ""}
  </div>`;
}

function renderUtilities() {
  const list = state.utilities ?? [];
  const order = { destructive: 0, writes: 1, "read-only": 2 };
  const sorted = [...list].sort((a, b) =>
    (order[a.impact] ?? 9) - (order[b.impact] ?? 9) || a.id.localeCompare(b.id));
  return `<div class="util-layout">
    <div class="util-list">${sorted.map(utilityRow).join("") || `<div class="card empty">No utilities loaded.</div>`}</div>
    <div>${runPanel()}</div>
  </div>`;
}

/* --------------------------------------------------------------- data model */

function bars(entries) {
  const max = Math.max(...entries.map(([, n]) => n), 1);
  return `<div class="bars">${entries.map(([name, n]) => `
    <div class="bar-row">
      <span>${esc(name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${(n / max) * 100}%"></div></div>
      <span class="n">${num(n)}</span>
    </div>`).join("")}</div>`;
}

function renderModel() {
  const available = Object.entries(state.models).filter(([, m]) => m);
  if (!available.length) {
    return `<div class="card empty">No environment has a data-model snapshot on this host yet.
      Run <code>data-model-analysis</code> against one to create the first — every
      destructive utility reads it before it will write.</div>`;
  }
  return available.map(([env, m]) => {
    const s = m.summary ?? {};
    const dev = m.deviations ?? {};
    return `<div class="section">
      <header><h3>${esc(env)}</h3>
        <p>fingerprint ${esc(m.fingerprint ?? "?")} · captured ${when(m.generated_at)}
           ${m.generated_by ? `· by ${esc(m.generated_by)}` : ""}</p></header>
      <div class="stats">
        <div class="stat"><div class="v">${num(s.schemas)}</div><div class="k">Tenant schemas</div></div>
        <div class="stat"><div class="v">${num(s.tables)}</div><div class="k">Tables</div></div>
        <div class="stat"><div class="v">${num(s.references)}</div><div class="k">Resolved references</div></div>
        <div class="stat"><div class="v">${num(s.deviations)}</div><div class="k">Naming deviations</div></div>
      </div>
      ${Object.keys(dev).length ? `
        <div style="margin-top:20px">
          <span class="lbl">Deviations by kind — what the model could not resolve</span>
          <div style="margin-top:9px">${bars(Object.entries(dev).sort((a, b) => b[1] - a[1]))}</div>
        </div>` : ""}
    </div>`;
  }).join("");
}

/* ----------------------------------------------------------------- activity */

const OUTCOME = { success: "ok", failed: "danger", interrupted: "warn" };
const JOB_TONE = {
  succeeded: "ok", failed: "danger", running: "warn", queued: "idle",
  pending_approval: "warn", rejected: "danger", cancelled: "idle",
};

function auditTable(records) {
  if (!records.length) {
    return `<div class="tablewrap"><p class="empty">No runs recorded on this host yet.
      Utilities run from the command line are recorded here too.</p></div>`;
  }
  return `<div class="tablewrap"><table>
    <thead><tr><th>Utility</th><th>Env</th><th>Mode</th><th>Outcome</th><th>Actor</th>
      <th class="num">Rows</th><th>Started</th></tr></thead>
    <tbody>${records.map((r) => {
      const rows = Object.values(r.rows_affected ?? {}).reduce((a, b) => a + b, 0);
      return `<tr>
        <td><code>${esc(r.utility)}</code></td>
        <td>${esc(r.environment)}</td>
        <td>${r.mode === "apply" ? pill("warn", "apply") : pill("idle", "dry run")}</td>
        <td>${pill(OUTCOME[r.outcome] ?? "idle", r.outcome ?? "—")}</td>
        <td>${esc(r.actor)}</td>
        <td class="num">${rows ? num(rows) : "—"}</td>
        <td class="num">${when(r.started_at)}</td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

function jobsTable(jobs) {
  if (!jobs.length) {
    return `<div class="tablewrap"><p class="empty">No runs have been submitted through this
      console yet.</p></div>`;
  }
  return `<div class="tablewrap"><table>
    <thead><tr><th>Utility</th><th>Env</th><th>Mode</th><th>State</th><th>Requested by</th>
      <th>Requested</th></tr></thead>
    <tbody>${jobs.map((j) => `<tr>
      <td><code>${esc(j.utility_id)}</code></td>
      <td>${esc(j.environment)}</td>
      <td>${j.apply ? pill("warn", "apply") : pill("idle", "dry run")}</td>
      <td>${pill(JOB_TONE[j.state] ?? "idle", (j.state ?? "").replace("_", " "))}
        ${j.error ? `<div class="muted" style="font-size:11.5px">${esc(j.error)}</div>` : ""}</td>
      <td>${esc(j.requested_by)}</td>
      <td class="num">${when(j.requested_at)}</td>
    </tr>`).join("")}</tbody></table></div>`;
}

function renderActivity() {
  return `
    <div class="section">
      <header><h3>Jobs</h3><p>Runs submitted through this service.</p></header>
      ${jobsTable(state.jobs ?? [])}
    </div>
    <div class="section">
      <header><h3>Audit trail</h3>
        <p>Written on every invocation, whether it succeeded, failed or was interrupted —
           including runs started from the command line.</p></header>
      ${auditTable(state.audit ?? [])}
    </div>`;
}

/* ------------------------------------------------------------------ routing */

function render() {
  const view = currentView();
  $("view-title").textContent = view.title;
  $("view-sub").textContent = view.sub;
  renderNav();

  const body = {
    overview: renderOverview,
    environments: () => `<div class="grid g2">${(state.environments ?? []).map(envCard).join("")}</div>`,
    utilities: renderUtilities,
    model: renderModel,
    activity: renderActivity,
  }[view.id];

  const notice = accessNotice();
  try {
    $("view").innerHTML = notice + body();
  } catch (error) {
    // The notice still goes out: with nothing readable, every view throws, and
    // the reason is more useful than five copies of the same error.
    $("view").innerHTML = notice + (notice ? "" : fail(error.message));
  }
  wire();
}

/* ------------------------------------------------------------------ wiring */

function wire() {
  for (const button of document.querySelectorAll("[data-util]")) {
    button.onclick = () => {
      const id = button.dataset.util;
      state.selected = state.selected === id ? null : id;
      state.form = {};
      state.preview = null;
      render();
    };
  }
  for (const input of document.querySelectorAll("[data-field]")) {
    input.oninput = input.onchange = () => {
      state.form[input.dataset.field] = input.value;
      state.preview = null;
    };
  }
  for (const button of document.querySelectorAll("[data-mode]")) {
    button.onclick = () => {
      state.apply = button.dataset.mode === "apply";
      state.preview = null;
      render();
    };
  }
  const preview = $("btn-preview");
  if (preview) preview.onclick = () => submit(true);
  const run = $("btn-run");
  if (run) run.onclick = () => submit(false);
}

function requestBody() {
  const u = state.utilities.find((x) => x.id === state.selected);
  const args = {};
  for (const p of u.parameters) {
    const value = state.form[p.name];
    if (value === undefined || value === "") continue;
    args[p.name] = p.type === "integer" ? Number(value) : value;
  }
  return { utility_id: u.id, environment: state.form.__env ?? "dev", arguments: args, apply: state.apply };
}

async function submit(previewOnly) {
  const body = requestBody();
  const target = $("run-result");
  target.innerHTML = `<p class="muted" style="margin-top:12px"><span class="spin"></span>${
    previewOnly ? "building the command" : "submitting"}…</p>`;
  try {
    if (previewOnly) {
      // Always safe: this endpoint starts nothing, it just says what would run and
      // whether it would wait for an approver.
      state.preview = await api(`/api/utilities/${encodeURIComponent(body.utility_id)}/preview`, {
        method: "POST", body: JSON.stringify(body),
      });
      render();
      return;
    }
    const job = await api("/api/jobs", { method: "POST", body: JSON.stringify(body) });
    await refresh(["jobs", "audit"]);
    state.preview = null;
    render();
    $("run-result").innerHTML = job.state === "pending_approval"
      ? `<div class="banner warn" style="margin-top:12px"><strong>Submitted, waiting for an
           approver.</strong> Job <code>${esc(job.id.slice(0, 8))}</code> will not start until
           somebody else approves it.</div>`
      : `<div class="banner info" style="margin-top:12px"><strong>Submitted.</strong>
           Job <code>${esc(job.id.slice(0, 8))}</code> is ${esc(job.state)}. See
           <a href="#/activity">Activity</a>.</div>`;
  } catch (error) {
    target.innerHTML = `<div class="banner danger" style="margin-top:12px">${esc(error.message)}</div>`;
  }
}

/* ------------------------------------------------------------------- loading */

async function refresh(which) {
  const jobs = ["environments", "utilities", "jobs", "audit", "model"].filter(
    (k) => !which || which.includes(k));
  await Promise.all(jobs.map(async (kind) => {
    try {
      if (kind === "environments") {
        state.environments = (await api("/api/health/environments")).environments;
      } else if (kind === "utilities") {
        state.utilities = (await api("/api/utilities")).utilities;
      } else if (kind === "jobs") {
        state.jobs = (await api("/api/jobs")).jobs;
      } else if (kind === "audit") {
        state.audit = (await api("/api/audit?limit=50")).records;
      } else if (kind === "model") {
        for (const env of ["prod", "stage", "qa", "dev"]) {
          try { state.models[env] = await api(`/api/model/${env}`); }
          catch { state.models[env] = null; }
        }
      }
    } catch (error) {
      // A view that cannot load says so where it would have been, rather than
      // taking the rest of the page down with it.
      console.error(kind, error);
    }
  }));
}

window.addEventListener("hashchange", () => { state.preview = null; render(); });

(async () => {
  renderNav();
  await loadMe();
  // Utilities and the catalogue first: they are fast, and the health probe opens
  // tunnels to three databases per environment.
  await refresh(["utilities", "jobs", "audit"]);
  render();
  await refresh(["environments", "model"]);
  render();
})();
</script>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trd365-core"
version = "0.1.0"
description = "Shared foundation for trd365 maintenance utilities: environments, connections, data model, CLI conventions, audit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "sshtunnel>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Reading credentials from Key Vault. Optional on purpose: the import is lazy,
# and CI and every Claude Code session run without the SDK installed.
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

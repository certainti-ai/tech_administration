[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trd365-core"
version = "0.1.0"
description = "Shared foundation for trd365 maintenance utilities: environments, connections, data model, CLI conventions, audit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "sshtunnel>=0.4.0",
    # sshtunnel 0.4.0 references paramiko.DSSKey, which paramiko 4 removed along
    # with DSA support. Unpinned, pip installs paramiko 5 and every tunnel fails
    # with "module 'paramiko' has no attribute 'DSSKey'" — which is what happened
    # on the first real connection attempt from the VM. Every test fakes the
    # tunnel, so nothing here could have caught it.
    #
    # Pinned rather than replaced because maindb and orgdb are only reachable
    # through the bastion. Revisit if sshtunnel releases a paramiko-4 fix, or
    # move the tunnel onto plain OpenSSH and drop both dependencies.
    "paramiko>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Reading credentials from Key Vault. Optional on purpose: the import is lazy,
# and CI and every Claude Code session run without the SDK installed.
azure = ["azure-identity>=1.17", "azure-keyvault-secrets>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
